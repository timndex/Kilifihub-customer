workflows:
  android-apk:
    name: KilifiHub Customer Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      # ============================================================
      # Firebase config - set these as environment variables in
      # Codemagic UI -> App Settings -> Environment variables
      # ============================================================
      # GOOGLE_SERVICES_JSON: (paste entire google-services.json content)
      # FIREBASE_ANDROID_API_KEY: AIzaSy...
      # FIREBASE_ANDROID_APP_ID: 1:123456789:android:abc123
      # FIREBASE_MESSAGING_SENDER_ID: 123456789
      # FIREBASE_PROJECT_ID: kilifihub-customer
      # FIREBASE_STORAGE_BUCKET: kilifihub-customer.appspot.com

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Create fresh Flutter project and copy our code
        script: |
          flutter create --org com.kilifihub --project-name kilifihub_customer /tmp/fresh_project
          cp -r lib/ /tmp/fresh_project/lib/
          cp pubspec.yaml /tmp/fresh_project/pubspec.yaml
          if [ -d "assets" ]; then
            cp -r assets/ /tmp/fresh_project/assets/
          fi

          # Write google-services.json from environment variable
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > /tmp/fresh_project/android/app/google-services.json
            echo "google-services.json written from environment variable"
          else
            echo "WARNING: GOOGLE_SERVICES_JSON not set. Firebase will NOT work."
            cat > /tmp/fresh_project/android/app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.kilifihub.kilifihub_customer" }
              },
              "api_key": [{ "current_key": "placeholder" }],
              "services": {
                "appinvite_service": { "other_platform_oauth_client": [] }
              }
            }],
            "configuration_version": "1"
          }
          GSEOF
          fi

          # Write AndroidManifest.xml with our permissions
          cat > /tmp/fresh_project/android/app/src/main/AndroidManifest.xml << 'MANIFESTEOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:label="KilifiHub Customer"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name="com.google.firebase.messaging.FirebaseMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          MANIFESTEOF

          # Write network security config for HTTPS connections
          mkdir -p /tmp/fresh_project/android/app/src/main/res/xml
          cat > /tmp/fresh_project/android/app/src/main/res/xml/network_security_config.xml << 'NETSECEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">ats.unaux.com</domain>
                  <domain includeSubdomains="true">kilifihub.co.ke</domain>
                  <domain includeSubdomains="true">10.0.2.2</domain>
                  <domain includeSubdomains="true">localhost</domain>
              </domain-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          NETSECEOF

          rm -rf /Users/builder/clone/*
          cp -r /tmp/fresh_project/* /Users/builder/clone/
          cp -r /tmp/fresh_project/.* /Users/builder/clone/ 2>/dev/null || true
          echo "=== Fresh project copied ==="

      - name: Get Flutter packages
        script: flutter pub get

      - name: Patch Gradle files and cached plugins for our requirements
        script: |
          echo "=== Patching Gradle files using Python (Kotlin DSL aware) ==="

          python3 << 'PYEOF'
          import os, glob, re

          def is_kts(filepath):
              return filepath.endswith('.kts')

          # === 1. Patch app-level build.gradle.kts (or .gradle) ===
          for gradle_file in glob.glob("android/app/build.gradle*"):
              kts = is_kts(gradle_file)
              print(f"Patching {gradle_file} (Kotlin DSL={kts})...")

              with open(gradle_file, 'r') as f:
                  content = f.read()

              print(f"--- ORIGINAL {gradle_file} ---")
              print(content)
              print(f"--- END ORIGINAL ---")

              if 'com.google.gms.google-services' not in content:
                  if kts:
                      content = content.rstrip() + '\n\napply(plugin = "com.google.gms.google-services")\n'
                      print("Added google-services apply() (Kotlin DSL)")
                  else:
                      content = content.replace(
                          "apply plugin: 'com.android.application'",
                          "apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'"
                      )
                      if "apply plugin: 'com.android.application'" not in content:
                          content = "apply plugin: 'com.google.gms.google-services'\n" + content
                      print("Added google-services plugin (Groovy DSL)")

              if kts:
                  content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', content)
                  content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', content)
                  content = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 36', content)
                  content = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 36', content)
              else:
                  content = re.sub(r'compileSdk\s+flutter\.compileSdkVersion', 'compileSdk 36', content)
                  content = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', content)
                  content = re.sub(r'targetSdk\s+flutter\.targetSdkVersion', 'targetSdk 36', content)
                  content = re.sub(r'targetSdk\s+\d+', 'targetSdk 36', content)

              if 'isCoreLibraryDesugaringEnabled' not in content and 'coreLibraryDesugaringEnabled' not in content:
                  if kts:
                      content = content.replace(
                          'sourceCompatibility',
                          'isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility'
                      )
                  else:
                      content = content.replace(
                          'sourceCompatibility',
                          'coreLibraryDesugaringEnabled = true\n        sourceCompatibility'
                      )
                  print("Added isCoreLibraryDesugaringEnabled")

              if 'desugar_jdk_libs' not in content:
                  if 'dependencies {' in content:
                      content = content.replace(
                          'dependencies {',
                          'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                      )
                      print("Added desugaring dependency to existing dependencies block")
                  else:
                      if kts:
                          content = content.rstrip() + '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                      else:
                          content = content.rstrip() + '\n\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
                      print("Appended new dependencies block with desugaring")

              if 'shrinkResources' not in content:
                  if kts:
                      content = content.replace(
                          'minifyEnabled = false',
                          'minifyEnabled = false\n            shrinkResources = false'
                      )
                  else:
                      content = content.replace(
                          'minifyEnabled false',
                          'minifyEnabled false\n            shrinkResources false'
                      )

              content = content.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
              content = content.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
              if 'kotlinOptions' not in content and 'compileOptions' in content:
                  content = content.replace(
                      'targetCompatibility = JavaVersion.VERSION_17\n            }',
                      'targetCompatibility = JavaVersion.VERSION_17\n        }\n\n        kotlinOptions {\n            jvmTarget = "17"\n        }'
                  )

              with open(gradle_file, 'w') as f:
                  f.write(content)

              print(f"--- PATCHED {gradle_file} ---")
              print(content)
              print(f"--- END PATCHED ---")

              assert 'compileSdk = 36' in content or 'compileSdk 36' in content, "compileSdk 36 not found!"
              assert 'desugar_jdk_libs' in content, "desugar_jdk_libs dependency not found!"
              assert 'google-services' in content, "google-services plugin not found!"
              print("VERIFICATION: All critical patches confirmed!")

          # === 2. Patch project-level build.gradle for google-services ===
          for gradle_file in glob.glob("android/build.gradle*"):
              kts = is_kts(gradle_file)
              with open(gradle_file, 'r') as f:
                  content = f.read()

              if 'com.google.gms' not in content and 'google-services' not in content:
                  if kts:
                      buildscript_block = 'buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath("com.google.gms:google-services:4.4.2")\n    }\n}\n'
                      if 'plugins {' in content:
                          content = content.replace('plugins {', buildscript_block + 'plugins {')
                      else:
                          content = buildscript_block + content
                      print(f"Added google-services buildscript classpath to {gradle_file} (Kotlin DSL)")
                  else:
                      if 'buildscript' in content:
                          if 'dependencies {' in content:
                              content = content.replace(
                                  'dependencies {',
                                  "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'"
                              )
                          else:
                              content = content.rstrip() + "\n\ndependencies {\n    classpath 'com.google.gms:google-services:4.4.2'\n}\n"
                      else:
                          content = "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'\n    }\n}\n\n" + content
                      print(f"Added google-services buildscript classpath to {gradle_file} (Groovy DSL)")

              with open(gradle_file, 'w') as f:
                  f.write(content)

          # === 3. Patch ALL cached plugin build.gradle files ===
          pub_cache = os.path.expanduser("~/.pub-cache")
          patched_count = 0
          for root, dirs, files in os.walk(pub_cache):
              for fname in files:
                  if fname == "build.gradle":
                      fpath = os.path.join(root, fname)
                      try:
                          with open(fpath, 'r') as f:
                              plugin_content = f.read()

                          changed = False

                          new_content = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', plugin_content)
                          if new_content != plugin_content:
                              plugin_content = new_content
                              changed = True

                          new_content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', plugin_content)
                          if new_content != plugin_content:
                              plugin_content = new_content
                              changed = True

                          if 'namespace' not in plugin_content:
                              manifest_dir = os.path.join(os.path.dirname(fpath), 'src', 'main')
                              manifest_path = os.path.join(manifest_dir, 'AndroidManifest.xml')
                              if not os.path.exists(manifest_path):
                                  for search_root, _, search_files in os.walk(os.path.dirname(fpath)):
                                      if 'AndroidManifest.xml' in search_files:
                                          manifest_path = os.path.join(search_root, 'AndroidManifest.xml')
                                          break

                              if os.path.exists(manifest_path):
                                  with open(manifest_path, 'r') as mf:
                                      manifest_content = mf.read()
                                  pkg_match = re.search(r'package="([^"]+)"', manifest_content)
                                  if pkg_match:
                                      package_name = pkg_match.group(1)
                                      plugin_content = plugin_content.replace(
                                          'android {',
                                          f"android {{\n    namespace '{package_name}'"
                                      )
                                      changed = True
                                      print(f"Added namespace '{package_name}' to {fpath}")

                          if changed:
                              with open(fpath, 'w') as f:
                                  f.write(plugin_content)
                              patched_count += 1
                              print(f"Patched {fpath}")
                      except Exception as e:
                          print(f"Error patching {fpath}: {e}")

          print(f"Patched {patched_count} plugin build files")
          print("=== All patches complete ===")
          PYEOF

      - name: Fix missing namespaces in cached plugins (shell fallback)
        script: |
          echo "Fixing missing namespaces in cached plugins..."
          for BUILD_FILE in $(find ~/.pub-cache -name "build.gradle" -path "*/android/build.gradle"); do
            if ! grep -q "namespace" "$BUILD_FILE"; then
              MANIFEST=$(find "$(dirname "$BUILD_FILE")" -name "AndroidManifest.xml" | head -1)
              if [ -f "$MANIFEST" ]; then
                PACKAGE=$(grep -o 'package="[^"]*"' "$MANIFEST" | head -1 | sed 's/package="//;s/"//')
                if [ -n "$PACKAGE" ]; then
                  echo "Adding namespace '$PACKAGE' to $BUILD_FILE"
                  sed -i '' "s/^android {/android {\n    namespace '$PACKAGE'/" "$BUILD_FILE"
                fi
              fi
            fi
          done
          echo "=== Namespace fix complete ==="

      - name: Fix all Dart code issues and create missing files
        script: |
          set -e
          echo "Fixing Dart code issues..."

          python3 << 'PYEOF'
          import os, re

          # ============================================================
          # FIX 1: Create CartProvider if missing
          # Error: CartProvider isnt a type (search_screen.dart)
          # ============================================================
          providers_dir = "lib/providers"
          os.makedirs(providers_dir, exist_ok=True)
          cart_provider_path = os.path.join(providers_dir, "cart_provider.dart")

          if not os.path.exists(cart_provider_path):
              cart_provider_code = (
                  "import 'package:flutter/foundation.dart';\n"
                  "\n"
                  "class CartProvider with ChangeNotifier {\n"
                  "  final Map<String, int> _items = {};\n"
                  "\n"
                  "  Map<String, int> get items => {..._items};\n"
                  "\n"
                  "  int get itemCount => _items.length;\n"
                  "\n"
                  "  void addItem(String productId, int quantity) {\n"
                  "    if (_items.containsKey(productId)) {\n"
                  "      _items[productId] = _items[productId]! + quantity;\n"
                  "    } else {\n"
                  "      _items[productId] = quantity;\n"
                  "    }\n"
                  "    notifyListeners();\n"
                  "  }\n"
                  "\n"
                  "  void removeItem(String productId) {\n"
                  "    _items.remove(productId);\n"
                  "    notifyListeners();\n"
                  "  }\n"
                  "\n"
                  "  void updateQuantity(String productId, int quantity) {\n"
                  "    if (quantity <= 0) {\n"
                  "      _items.remove(productId);\n"
                  "    } else {\n"
                  "      _items[productId] = quantity;\n"
                  "    }\n"
                  "    notifyListeners();\n"
                  "  }\n"
                  "\n"
                  "  void clear() {\n"
                  "    _items.clear();\n"
                  "    notifyListeners();\n"
                  "  }\n"
                  "}\n"
              )
              with open(cart_provider_path, 'w') as f:
                  f.write(cart_provider_code)
              print("Created: cart_provider.dart")
          else:
              print("cart_provider.dart already exists")

          # ============================================================
          # FIX 2: Create OrderTrackingScreen if missing
          # Error: OrderTrackingScreen isnt defined (orders_screen.dart)
          # ============================================================
          order_tracking_path = "lib/screens/order_tracking_screen.dart"

          if not os.path.exists(order_tracking_path):
              order_tracking_code = (
                  "import 'package:flutter/material.dart';\n"
                  "\n"
                  "class OrderTrackingScreen extends StatelessWidget {\n"
                  "  final String orderId;\n"
                  "\n"
                  "  const OrderTrackingScreen({\n"
                  "    Key? key,\n"
                  "    required this.orderId,\n"
                  "  }) : super(key: key);\n"
                  "\n"
                  "  @override\n"
                  "  Widget build(BuildContext context) {\n"
                  "    return Scaffold(\n"
                  "      appBar: AppBar(\n"
                  "        title: Text('Track Order #' + orderId),\n"
                  "      ),\n"
                  "      body: Center(\n"
                  "        child: Column(\n"
                  "          mainAxisAlignment: MainAxisAlignment.center,\n"
                  "          children: [\n"
                  "            const Icon(Icons.local_shipping, size: 64, color: Colors.blue),\n"
                  "            const SizedBox(height: 16),\n"
                  "            Text(\n"
                  "              'Order #' + orderId,\n"
                  "              style: Theme.of(context).textTheme.headlineSmall,\n"
                  "            ),\n"
                  "            const SizedBox(height: 8),\n"
                  "            const Text('Tracking information will appear here'),\n"
                  "          ],\n"
                  "        ),\n"
                  "      ),\n"
                  "    );\n"
                  "  }\n"
                  "}\n"
              )
              with open(order_tracking_path, 'w') as f:
                  f.write(order_tracking_code)
              print("Created: order_tracking_screen.dart")
          else:
              print("order_tracking_screen.dart already exists")

          # ============================================================
          # FIX 3: Add CartProvider import to search_screen.dart
          # ============================================================
          search_file = "lib/screens/search_screen.dart"
          if os.path.exists(search_file):
              with open(search_file, 'r') as f:
                  content = f.read()
              if "cart_provider.dart" not in content:
                  content = "import '../providers/cart_provider.dart';\n" + content
                  with open(search_file, 'w') as f:
                      f.write(content)
                  print("Added CartProvider import to search_screen.dart")
              else:
                  print("CartProvider import already in search_screen.dart")

          # ============================================================
          # FIX 4: Replace mounted with context.mounted in cart_screen.dart
          # Error: getter mounted not defined for _CartItemCard
          # ============================================================
          cart_file = "lib/screens/cart_screen.dart"
          if os.path.exists(cart_file):
              with open(cart_file, 'r') as f:
                  content = f.read()
              content = content.replace("if (mounted)", "if (context.mounted)")
              with open(cart_file, 'w') as f:
                  f.write(content)
              print("Fixed mounted -> context.mounted in cart_screen.dart")

          # ============================================================
          # FIX 5: Add OrderTrackingScreen import to orders_screen.dart
          # ============================================================
          orders_file = "lib/screens/orders_screen.dart"
          if os.path.exists(orders_file):
              with open(orders_file, 'r') as f:
                  content = f.read()
              if "order_tracking_screen.dart" not in content:
                  content = "import 'order_tracking_screen.dart';\n" + content
                  with open(orders_file, 'w') as f:
                      f.write(content)
                  print("Added OrderTrackingScreen import to orders_screen.dart")
              else:
                  print("OrderTrackingScreen import already in orders_screen.dart")

          # ============================================================
          # FIX 6: Replace locationSettings with desiredAccuracy
          # in addresses_screen.dart (geolocator 10.x)
          # ============================================================
          addr_file = "lib/screens/addresses_screen.dart"
          if os.path.exists(addr_file):
              with open(addr_file, 'r') as f:
                  content = f.read()
              content = re.sub(
                  r'locationSettings:\s*const\s*LocationSettings\s*\([^)]*\)',
                  'desiredAccuracy: LocationAccuracy.high',
                  content,
                  flags=re.DOTALL
              )
              with open(addr_file, 'w') as f:
                  f.write(content)
              print("Fixed locationSettings -> desiredAccuracy in addresses_screen.dart")

          # Also fix location_service.dart if it exists
          loc_file = "lib/services/location_service.dart"
          if os.path.exists(loc_file):
              with open(loc_file, 'r') as f:
                  content = f.read()
              content = re.sub(
                  r'locationSettings:\s*const\s*LocationSettings\s*\([^)]*\)',
                  'desiredAccuracy: LocationAccuracy.high',
                  content,
                  flags=re.DOTALL
              )
              with open(loc_file, 'w') as f:
                  f.write(content)
              print("Fixed locationSettings in location_service.dart")

          # ============================================================
          # Update firebase_options.dart with real values from env vars
          # ============================================================
          firebase_opts = "lib/firebase_options.dart"
          if os.path.exists(firebase_opts):
              api_key = os.environ.get("FIREBASE_ANDROID_API_KEY", "")
              if api_key:
                  with open(firebase_opts, 'r') as f:
                      content = f.read()
                  content = content.replace("YOUR_ANDROID_API_KEY", api_key)
                  content = content.replace("YOUR_ANDROID_APP_ID", os.environ.get("FIREBASE_ANDROID_APP_ID", ""))
                  content = content.replace("YOUR_SENDER_ID", os.environ.get("FIREBASE_MESSAGING_SENDER_ID", ""))
                  content = content.replace("YOUR_PROJECT_ID", os.environ.get("FIREBASE_PROJECT_ID", ""))
                  content = content.replace("YOUR_PROJECT_ID.appspot.com", os.environ.get("FIREBASE_STORAGE_BUCKET", ""))
                  with open(firebase_opts, 'w') as f:
                      f.write(content)
                  print("Firebase options updated from environment variables")
              else:
                  print("WARNING: Firebase env vars not set. Using placeholder values.")

          # ============================================================
          # Fix CardTheme -> CardThemeData in main.dart
          # Also add CartProvider and provider imports
          # Fix const expression error with CupertinoPageTransitionsBuilder
          # ============================================================
          main_file = "lib/main.dart"
          if os.path.exists(main_file):
              with open(main_file, 'r') as f:
                  content = f.read()
              content = content.replace("CardTheme(", "CardThemeData(")
              if "cart_provider.dart" not in content:
                  content = "import 'providers/cart_provider.dart';\n" + content
                  print("Added CartProvider import to main.dart")
              if "package:provider" not in content:
                  content = "import 'package:provider/provider.dart';\n" + content
                  print("Added provider import to main.dart")
              # FIX: CupertinoPageTransitionsBuilder needs cupertino import
              if "CupertinoPageTransitionsBuilder" in content and "package:flutter/cupertino.dart" not in content:
                  content = "import 'package:flutter/cupertino.dart';\n" + content
                  print("Added cupertino import to main.dart")
              # FIX: const expression with CupertinoPageTransitionsBuilder
              # CupertinoPageTransitionsBuilder() is not const, so the const
              # keyword must be removed from the enclosing constructor
              # Pattern 1: const PageTransitionsTheme( -> PageTransitionsTheme(
              content = content.replace(
                  "const PageTransitionsTheme(",
                  "PageTransitionsTheme("
              )
              # Pattern 2: const <TargetPlatform, PageTransitionsBuilder>{
              content = content.replace(
                  "const <TargetPlatform, PageTransitionsBuilder>{",
                  "<TargetPlatform, PageTransitionsBuilder>{"
              )
              # Pattern 3: const ThemeData( or other const wrapping it
              if "const ThemeData(" in content and "CupertinoPageTransitionsBuilder" in content:
                  content = content.replace("const ThemeData(", "ThemeData(")
              # Pattern 4: Aggressive fallback - find any remaining const before
              # a map/constructor that contains CupertinoPageTransitionsBuilder
              # Use regex to find const followed by any widget constructor on a line
              # near CupertinoPageTransitionsBuilder usage
              lines = content.split('\n')
              new_lines = []
              in_page_transitions = False
              for line in lines:
                  if 'PageTransitionsTheme' in line or 'pageTransitionsTheme' in line:
                      in_page_transitions = True
                  if in_page_transitions and line.strip().startswith('const '):
                      line = line.replace('const ', '', 1)
                  if in_page_transitions and '},' in line:
                      in_page_transitions = False
                  new_lines.append(line)
              content = '\n'.join(new_lines)
              with open(main_file, 'w') as f:
                  f.write(content)
              print("Fixed main.dart (CardTheme, const fixes, imports)")

          # ============================================================
          # Fix push_notification_service.dart
          # ============================================================
          push_file = "lib/services/push_notification_service.dart"
          if os.path.exists(push_file):
              with open(push_file, 'r') as f:
                  content = f.read()
              content = content.replace("const AndroidNotificationDetails androidDetails", "AndroidNotificationDetails androidDetails")
              content = content.replace("const NotificationDetails details", "NotificationDetails details")
              with open(push_file, 'w') as f:
                  f.write(content)
              print("Fixed push_notification_service.dart")

          # ============================================================
          # Fix api_service.dart
          # Fix StorageService() -> StorageService.instance
          # Fix connectivity check - the installed connectivity_plus version
          # returns a single ConnectivityResult enum (not a List), so
          # .contains() doesn't work. Use == comparison instead.
          # ============================================================
          api_file = "lib/services/api_service.dart"
          if os.path.exists(api_file):
              with open(api_file, 'r') as f:
                  content = f.read()
              content = content.replace("StorageService()", "StorageService.instance")
              # Fix: .contains() doesn't work on ConnectivityResult enum
              # Use regex to catch various patterns of the check
              # Pattern: connectivityResult.contains(ConnectivityResult.none)
              content = re.sub(
                  r'(\w+)\.contains\(ConnectivityResult\.none\)',
                  r'\1 == ConnectivityResult.none',
                  content
              )
              with open(api_file, 'w') as f:
                  f.write(content)
              print("Fixed api_service.dart (StorageService, ConnectivityResult)")

          # ============================================================
          # Fix api_config.dart
          # ============================================================
          api_cfg = "lib/config/api_config.dart"
          if os.path.exists(api_cfg):
              with open(api_cfg, 'r') as f:
                  content = f.read()
              content = content.replace(
                  "static const double GPS_DISTANCE_FILTER_METERS = 5.0;",
                  "static const int GPS_DISTANCE_FILTER_METERS = 5;"
              )
              with open(api_cfg, 'w') as f:
                  f.write(content)
              print("Fixed api_config.dart")

          # ============================================================
          # FIX NEW: home_screen.dart RefreshIndicator ambiguous import
          # Error: RefreshIndicator imported from both
          # flutter/material and pull_to_refresh_flutter3
          # Fix: hide RefreshIndicator from the pull_to_refresh import
          # ============================================================
          home_file = "lib/screens/home_screen.dart"
          if os.path.exists(home_file):
              with open(home_file, 'r') as f:
                  content = f.read()
              # If pull_to_refresh is imported without hiding, add hide
              if "pull_to_refresh_flutter3" in content and "hide RefreshIndicator" not in content:
                  content = content.replace(
                      "import 'package:pull_to_refresh_flutter3/pull_to_refresh_flutter3.dart';",
                      "import 'package:pull_to_refresh_flutter3/pull_to_refresh_flutter3.dart' hide RefreshIndicator;"
                  )
                  # Also handle other possible import paths
                  content = re.sub(
                      r"import 'package:pull_to_refresh_flutter3/[^']*';(?!\s*hide)",
                      lambda m: m.group(0).rstrip(";") + " hide RefreshIndicator;",
                      content
                  )
                  with open(home_file, 'w') as f:
                      f.write(content)
                  print("Fixed RefreshIndicator ambiguous import in home_screen.dart")
              else:
                  print("home_screen.dart already fixed or no conflict")

          # ============================================================
          # FIX NEW: stores_screen.dart CategoryModel missing singular param
          # Error: Required named parameter 'singular' must be provided
          # Fix: add singular parameter to CategoryModel constructor call
          # ============================================================
          stores_file = "lib/screens/stores_screen.dart"
          if os.path.exists(stores_file):
              with open(stores_file, 'r') as f:
                  content = f.read()
              # Fix: CategoryModel(slug: args, label: args.toUpperCase())
              # needs: singular parameter
              if "CategoryModel(slug:" in content and "singular" not in content.split("CategoryModel")[1].split(")")[0]:
                  # Replace the CategoryModel constructor call to add singular
                  content = re.sub(
                      r'CategoryModel\(slug:\s*(\w+),\s*label:\s*(\w+)\.toUpperCase\(\)\)',
                      r'CategoryModel(slug: \1, label: \2.toUpperCase(), singular: \2)',
                      content
                  )
                  with open(stores_file, 'w') as f:
                      f.write(content)
                  print("Fixed CategoryModel missing singular param in stores_screen.dart")
              else:
                  print("stores_screen.dart CategoryModel already fixed or no issue")

          print("=== All Dart fixes complete ===")
          PYEOF


