              with open(guest_home_path, 'w') as f:
                  f.write('\n'.join(guest_code_lines) + '\n')
              print("Created: guest_home_screen.dart")
          else:
              print("guest_home_screen.dart already exists")

          # ============================================================
          # PATCH: main.dart
          # SAFE minimal changes that cannot break the app.
          # ============================================================
          main_file = "lib/main.dart"
          if os.path.exists(main_file):
              with open(main_file, 'r') as f:
                  content = f.read()

              # Add imports
              if "demo_mode.dart" not in content:
                  content = "import 'utils/demo_mode.dart';\n" + content
                  print("Added demo_mode import to main.dart")
              if "guest_home_screen.dart" not in content:
                  content = "import 'screens/guest_home_screen.dart';\n" + content
                  print("Added guest_home_screen import to main.dart")

              # Make main() async if not already
              if "void main() async" not in content:
                  content = content.replace("void main() {", "void main() async {")
                  print("Made main() async")

              # Add WidgetsFlutterBinding.ensureInitialized() if not present
              if "WidgetsFlutterBinding.ensureInitialized()" not in content:
                  content = content.replace(
                      "void main() async {",
                      "void main() async {\n  WidgetsFlutterBinding.ensureInitialized();"
                  )
                  print("Added ensureInitialized to main()")

              # Add global error handler - PREVENTS black screen on crashes
              if "FlutterError.onError" not in content:
                  content = content.replace(
                      "WidgetsFlutterBinding.ensureInitialized();",
                      "WidgetsFlutterBinding.ensureInitialized();\n"
                      "  FlutterError.onError = (details) {\n"
                      "    debugPrint('FlutterError: ${details.exceptionAsString()}');\n"
                      "  };"
                  )
                  print("Added FlutterError.onError handler")

              # Add demo mode check and server auto-detect
              if "await DemoMode.checkGuestMode()" not in content:
                  # Find the line with the error handler closing and add after it
                  content = content.replace(
                      "  };\n",
                      "  };\n"
                      "  await DemoMode.checkGuestMode();\n"
                      "  if (!DemoMode.isGuest) {\n"
                      "    final reachable = await DemoMode.isServerReachable();\n"
                      "    if (!reachable) {\n"
                      "      await DemoMode.enableGuestMode();\n"
                      "    }\n"
                      "  }\n",
                      1  # Only replace first occurrence
                  )
                  print("Added demo mode check and server auto-detect")

              # Add /guest_home route if routes: section exists
              if "routes:" in content and "'/guest_home'" not in content:
                  content = content.replace(
                      "routes: {",
                      "routes: {\n      '/guest_home': (context) => GuestHomeScreen(),"
                  )
                  print("Added /guest_home route")

              # CONDITIONAL runApp: If demo mode, run demo app; else original
              # Strategy: Insert early-return BEFORE runApp() - much safer
              # than trying to wrap it with if/else
              # Check: is there already a runApp with GuestHomeScreen?
              has_demo_runapp = any('runApp' in line and 'GuestHomeScreen' in line for line in content.split('\n'))
              if not has_demo_runapp:
                  lines = content.split('\n')
                  new_lines = []
                  for line in lines:
                      if 'runApp(' in line and 'GuestHomeScreen' not in line and 'debugPrint' not in line and 'DemoMode' not in line:
                          indent = line[:len(line) - len(line.lstrip())]
                          # Insert demo mode check with early return
                          # This is safe: original runApp is untouched
                          new_lines.append(f"{indent}if (DemoMode.isGuest) {{")
                          new_lines.append(f"{indent}  runApp(MaterialApp(")
                          new_lines.append(f"{indent}    home: GuestHomeScreen(),")
                          new_lines.append(f"{indent}    debugShowCheckedModeBanner: false,")
                          new_lines.append(f"{indent}  ));")
                          new_lines.append(f"{indent}  return;")
                          new_lines.append(f"{indent}}}")
                      new_lines.append(line)
                  content = '\n'.join(new_lines)
                  print("Added conditional runApp with demo mode check")

              with open(main_file, 'w') as f:
                  f.write(content)
              print("Patched main.dart with guest mode support")

          # ============================================================
          # PATCH: api_service.dart
          # Wrap HTTP requests in try-catch; return demo data on error
          # ============================================================
          api_file = "lib/services/api_service.dart"
          if os.path.exists(api_file):
              with open(api_file, 'r') as f:
                  content = f.read()

              if "demo_mode.dart" not in content:
                  content = "import '../utils/demo_mode.dart';\n" + content

              # Add demo fallback helper method
              if "DemoMode.getDemoResponse" not in content:
                  demo_helper = (
                      "\n"
                      "  // Demo mode: returns mock data when server is unreachable\n"
                      "  dynamic _getDemoFallback(String endpoint) {\n"
                      "    if (!DemoMode.isGuest) return null;\n"
                      "    return DemoMode.getDemoResponse(endpoint);\n"
                      "  }\n"
                  )
                  last_brace_pos = content.rfind('}')
                  if last_brace_pos > 0:
                      content = content[:last_brace_pos] + demo_helper + content[last_brace_pos:]

              # Add safe API call wrapper
              if "_safeApiCall" not in content:
                  safe_call_method = (
                      "\n"
                      "  // Safe API call - never throws, returns demo data on error\n"
                      "  Future<dynamic> _safeApiCall(String endpoint, Future<dynamic> Function() apiCall) async {\n"
                      "    try {\n"
                      "      return await apiCall();\n"
                      "    } catch (e) {\n"
                      "      debugPrint('API call failed: $e');\n"
                      "      final demoData = _getDemoFallback(endpoint);\n"
                      "      if (demoData != null) return demoData;\n"
                      "      return {'data': []};\n"
                      "    }\n"
                      "  }\n"
                  )
                  last_brace_pos = content.rfind('}')
                  if last_brace_pos > 0:
                      content = content[:last_brace_pos] + safe_call_method + content[last_brace_pos:]

              # Bypass blocking connectivity checks
              if "ConnectivityResult.none" in content or "connectivityResult" in content:
                  lines = content.split('\n')
                  new_lines = []
                  for line in lines:
                      if ('ConnectivityResult.none' in line and
                          ('return' in line or 'throw' in line or 'showDialog' in line or
                           'ScaffoldMessenger' in line or 'connection error' in line.lower() or
                           'check your internet' in line.lower())):
                          new_lines.append('//' + line)
                      else:
                          new_lines.append(line)
                  content = '\n'.join(new_lines)
                  print("Bypassed blocking connectivity check in api_service.dart")

              if "import 'dart:io'" not in content and "dart:io" not in content:
                  content = "import 'dart:io';\n" + content

              with open(api_file, 'w') as f:
                  f.write(content)
              print("Patched api_service.dart with safe API wrapper")

          # ============================================================
          # PATCH: login_screen.dart - add Demo Mode FAB (safe)
          # ============================================================
          login_file = "lib/screens/login_screen.dart"
          if os.path.exists(login_file):
              with open(login_file, 'r') as f:
                  content = f.read()

              if "demo_mode.dart" not in content:
                  content = "import '../utils/demo_mode.dart';\n" + content

              if "enableGuestMode" not in content:
                  lines = content.split('\n')
                  new_lines = []
                  scaffold_found = False
                  for line in lines:
                      new_lines.append(line)
                      if 'return Scaffold(' in line and not scaffold_found:
                          scaffold_found = True
                          indent = line[:len(line) - len(line.lstrip())]
                          new_lines.append(f"{indent}  floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,")
                          new_lines.append(f"{indent}  floatingActionButton: FloatingActionButton.extended(")
                          new_lines.append(f"{indent}    onPressed: () async {{")
                          new_lines.append(f"{indent}      await DemoMode.enableGuestMode();")
                          new_lines.append(f"{indent}      if (context.mounted) {{")
                          new_lines.append(f"{indent}        Navigator.of(context).pushReplacementNamed('/guest_home');")
                          new_lines.append(f"{indent}      }}")
                          new_lines.append(f"{indent}    }},")
                          new_lines.append(f"{indent}    icon: Icon(Icons.explore),")
                          new_lines.append(f"{indent}    label: Text('Browse as Guest'),")
                          new_lines.append(f"{indent}    backgroundColor: Colors.orange,")
                          new_lines.append(f"{indent}  ),")
                  content = '\n'.join(new_lines)
                  print("Added Demo Mode FAB to login_screen.dart")

              with open(login_file, 'w') as f:
                  f.write(content)

          # ============================================================
          # PATCH: splash screens - navigate even on error
          # ============================================================
          for splash_name in ['splash_screen.dart', 'splash.dart']:
              splash_path = f"lib/screens/{splash_name}"
              if os.path.exists(splash_path):
                  with open(splash_path, 'r') as f:
                      content = f.read()

                  if "demo_mode.dart" not in content:
                      content = "import '../utils/demo_mode.dart';\n" + content

                  if "DemoMode" not in content:
                      content = content.replace(
                          "pushReplacementNamed('/login')",
                          "pushReplacementNamed(DemoMode.isGuest ? '/guest_home' : '/login')"
                      )
                      content = content.replace(
                          "pushReplacementNamed('/home')",
                          "pushReplacementNamed(DemoMode.isGuest ? '/guest_home' : '/home')"
                      )

                  if "DemoMode.checkGuestMode" not in content and "initState()" in content:
                      content = content.replace(
                          "super.initState();",
                          "super.initState();\n"
                          "    DemoMode.checkGuestMode().then((isGuest) {\n"
                          "      if (isGuest && mounted) {\n"
                          "        Navigator.of(context).pushReplacementNamed('/guest_home');\n"
                          "      }\n"
                          "    });"
                      )

                  with open(splash_path, 'w') as f:
                      f.write(content)
                  print(f"Patched {splash_name} with demo mode support")

          # ============================================================
          # PATCH: auth gate screens - bypass in demo mode
          # ============================================================
          for auth_name in ['auth_screen.dart', 'auth_gate.dart', 'auth_wrapper.dart', 'auth.dart']:
              auth_path = f"lib/screens/{auth_name}"
              if os.path.exists(auth_path):
                  with open(auth_path, 'r') as f:
                      content = f.read()

                  if "demo_mode.dart" not in content:
                      content = "import '../utils/demo_mode.dart';\n" + content
                  if "guest_home_screen.dart" not in content:
                      content = "import 'guest_home_screen.dart';\n" + content

                  if "DemoMode" not in content:
                      content = content.replace(
                          "Widget build(BuildContext context) {",
                          "Widget build(BuildContext context) {\n"
                          "    if (DemoMode.isGuest) {\n"
                          "      return GuestHomeScreen();\n"
                          "    }"
                      )

                  with open(auth_path, 'w') as f:
                      f.write(content)
                  print(f"Patched {auth_name} with demo mode bypass")

          print("=== Demo/Guest Mode setup complete ===")
          PYEOF

      - name: Re-get packages after pubspec fix
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --debug --android-skip-build-dependency-validation

