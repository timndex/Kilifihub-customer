name: kilifihub_customer
description: KilifiHub Customer App — Order food, medicine, groceries, and more from local stores with delivery.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  smooth_page_indicator: ^1.1.0

  # State Management
  provider: ^6.1.1

  # HTTP & API
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Authentication & Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.3

  # Image Handling
  image_picker: ^1.0.7

  # Firebase - Push Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Local Notifications
  flutter_local_notifications: ^18.0.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.2
  permission_handler: ^11.1.0
  flutter_spinkit: ^5.2.0
  connectivity_plus: ^5.0.2
  pull_to_refresh_flutter3: ^2.0.2
  flutter_polyline_points: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
